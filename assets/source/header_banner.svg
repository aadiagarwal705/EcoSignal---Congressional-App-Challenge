<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5E9F6"/><stop offset="1" stop-color="#F3FAFC"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D3EC"/><stop offset="1" stop-color="#7DB9DC"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/></linearGradient>
    <g id="pine">
      <rect x="-5" y="10" width="10" height="30" fill="#2A5C44"/>
      <polygon points="0,-110 -36,-56 36,-56" fill="#2F7D5B"/>
      <polygon points="0,-80 -46,-14 46,-14" fill="#2C7355"/>
      <polygon points="0,-46 -56,26 56,26" fill="#276648"/>
    </g>
  </defs>
  <rect width="1500" height="500" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 250C150 190 300 200 450 235C600 268 750 200 900 215C1050 230 1200 190 1500 240V340H0Z" fill="#B7D9D4"/>
  <path d="M0 285C200 232 380 252 560 278C740 304 900 254 1100 266C1250 276 1400 248 1500 268V350H0Z" fill="#8CC7A0"/>
  <!-- lake -->
  <rect y="300" width="1500" height="200" fill="url(#lake)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M300 330h120M620 350h160M980 336h140M1120 372h110M140 372h100"/>
  </g>
  <!-- bridge -->
  <g fill="#8797A3">
    <rect x="560" y="284" width="470" height="9"/>
    <g id="piers"><rect x="580" y="293" width="9" height="34"/><rect x="640" y="293" width="9" height="34"/><rect x="700" y="293" width="9" height="34"/><rect x="760" y="293" width="9" height="34"/><rect x="820" y="293" width="9" height="34"/><rect x="880" y="293" width="9" height="34"/><rect x="940" y="293" width="9" height="34"/><rect x="1000" y="293" width="9" height="34"/></g>
  </g>
  <!-- foreground land -->
  <path d="M0 500V326C120 296 260 326 380 380C440 408 480 450 520 500Z" fill="#3F9160"/>
  <path d="M1500 500V296C1380 296 1260 336 1150 398C1100 428 1060 468 1030 500Z" fill="#348054"/>
  <!-- pines -->
  <use href="#pine" transform="translate(42 372) scale(0.9)"/>
  <use href="#pine" transform="translate(128 392) scale(0.68)"/>
  <use href="#pine" transform="translate(1448 356) scale(1.0)"/>
  <use href="#pine" transform="translate(1366 386) scale(0.72)"/>
  <use href="#pine" transform="translate(1290 410) scale(0.5)"/>
  <!-- heron -->
  <g transform="translate(1235 300)">
    <path d="M0 84L2 20M14 82L16 18" stroke="#3A4A55" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="6" cy="6" rx="36" ry="19" transform="rotate(-18 6 6)" fill="#5B7A8C"/>
    <polygon points="34,-4 76,-18 40,14" fill="#4A6676"/>
    <path d="M-22 -6C-42 -46 2 -58 -10 -96" stroke="#5B7A8C" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="-10" cy="-98" r="9" fill="#5B7A8C"/>
    <polygon points="-18,-101 -58,-92 -18,-93" fill="#E0A030"/>
    <path d="M-9 -106L18 -122" stroke="#233742" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- fade to white so the content card blends in -->
  <rect y="400" width="1500" height="100" fill="url(#fade)"/>
</svg>
